<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>魏煜汶 · 生日快乐 Happy Birthday</title>
<style>
/* ========================== 全局样式 ========================== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #030014;
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  color: #fff; user-select: none;
}
/* Three.js 画布铺满全屏作为背景 */
#webgl { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 1; }

/* ========================== 覆盖层 UI ========================== */
#ui {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  pointer-events: none; padding: 4vh 4vw 5vh;
}
#ui > * { pointer-events: auto; }

/* 副标题（柔和光晕渐显） */
.subtitle-wrap { text-align: center; margin-bottom: 2.2vh; opacity: 0; transition: opacity 1.6s ease; }
.subtitle-wrap.show { opacity: 1; }
.subtitle-main {
  font-size: clamp(20px, 4.4vw, 40px); font-weight: 700; letter-spacing: 6px;
  background: linear-gradient(90deg, #7ee8fa, #c9a6ff, #ff9ad5);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 24px rgba(150, 120, 255, 0.35);
  animation: floaty 4s ease-in-out infinite;
}
.subtitle-sub {
  margin-top: 8px; font-size: clamp(12px, 2.4vw, 17px); letter-spacing: 3px;
  color: #b9c6ff; text-shadow: 0 0 14px rgba(120, 160, 255, 0.6); opacity: 0.92;
}
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* 打字机祝福卡片 */
.wish-card {
  width: min(720px, 92vw);
  background: rgba(18, 12, 46, 0.42);
  border: 1px solid rgba(160, 130, 255, 0.35);
  border-radius: 20px; padding: 20px 24px; margin-bottom: 2.4vh;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 0 40px rgba(120, 80, 255, 0.28), inset 0 0 30px rgba(90, 140, 255, 0.08);
  opacity: 0; transform: translateY(20px); transition: opacity 1.2s ease, transform 1.2s ease;
}
.wish-card.show { opacity: 1; transform: translateY(0); }
#wishText {
  font-size: clamp(14px, 2.7vw, 19px); line-height: 1.95; letter-spacing: 1px;
  color: #eaf0ff; min-height: 3.9em;
  text-shadow: 0 0 12px rgba(140, 180, 255, 0.55);
}
#wishText .cursor { display: inline-block; width: 2px; height: 1.05em; background: #9ad7ff; margin-left: 2px; vertical-align: text-bottom; animation: blink 0.85s steps(1) infinite; box-shadow: 0 0 10px #7ee8fa; }
@keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.sign { margin-top: 12px; text-align: right; font-size: clamp(12px, 2.3vw, 15px); color: #c7b6ff; letter-spacing: 2px; opacity: 0.9; text-shadow: 0 0 10px rgba(160,120,255,0.5); }

/* 按钮组 */
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 1.4vh; }
.neon-btn {
  position: relative; cursor: pointer; border: none; outline: none;
  padding: 12px 22px; border-radius: 40px; font-size: clamp(13px, 2.5vw, 16px);
  font-weight: 700; letter-spacing: 2px; color: #fff; font-family: inherit;
  background: linear-gradient(120deg, rgba(60,90,220,0.55), rgba(150,70,220,0.55));
  border: 1px solid rgba(170, 190, 255, 0.55);
  box-shadow: 0 0 18px rgba(110, 130, 255, 0.5), inset 0 0 14px rgba(180, 200, 255, 0.15);
  transition: transform 0.18s ease, box-shadow 0.25s ease, filter 0.25s ease;
  overflow: hidden;
}
.neon-btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 32px rgba(150, 120, 255, 0.85), inset 0 0 18px rgba(200, 220, 255, 0.25); filter: brightness(1.12); }
.neon-btn:active { transform: translateY(0) scale(0.97); }
.neon-btn.pink { background: linear-gradient(120deg, rgba(230,80,170,0.55), rgba(150,70,220,0.55)); box-shadow: 0 0 18px rgba(255, 120, 200, 0.5), inset 0 0 14px rgba(255, 200, 240, 0.15); }
.neon-btn.gold { background: linear-gradient(120deg, rgba(230,170,60,0.5), rgba(230,110,180,0.5)); box-shadow: 0 0 18px rgba(255, 200, 100, 0.5), inset 0 0 14px rgba(255, 230, 180, 0.15); }
.neon-btn.cyan { background: linear-gradient(120deg, rgba(40,180,220,0.55), rgba(90,110,240,0.55)); box-shadow: 0 0 18px rgba(90, 220, 255, 0.5), inset 0 0 14px rgba(190, 240, 255, 0.15); }
.neon-btn:disabled { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.4); }

/* 提示 Toast */
#toast {
  position: fixed; top: 12vh; left: 50%; transform: translateX(-50%) scale(0.9);
  z-index: 40; padding: 14px 30px; border-radius: 16px; font-size: clamp(15px,3vw,20px);
  font-weight: 700; letter-spacing: 3px; opacity: 0; pointer-events: none;
  background: rgba(30, 16, 70, 0.6); border: 1px solid rgba(190,150,255,0.6);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(160,110,255,0.7);
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2,1.4,0.4,1);
  text-shadow: 0 0 16px rgba(190,150,255,0.9);
}
#toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

/* 开场提示（点击开始，用于解锁音频） */
#startHint {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 18px; background: radial-gradient(circle at 50% 40%, rgba(30,20,80,0.55), rgba(3,0,20,0.92));
  transition: opacity 1s ease; cursor: pointer; text-align: center; padding: 20px;
}
#startHint.hide { opacity: 0; pointer-events: none; }
#startHint .big {
  font-size: clamp(22px, 5vw, 40px); font-weight: 800; letter-spacing: 4px;
  background: linear-gradient(90deg,#7ee8fa,#c9a6ff,#ff9ad5,#ffe6a0);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: floaty 3.5s ease-in-out infinite;
}
#startHint .tap { font-size: clamp(13px,2.6vw,17px); color:#cdd8ff; letter-spacing:3px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }

/* 许愿弹窗 */
#wishModal { position: fixed; inset: 0; z-index: 45; display: none; align-items: center; justify-content: center; background: rgba(3,0,20,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 20px; }
#wishModal.show { display: flex; }
.modal-box {
  width: min(440px, 92vw); background: rgba(24,14,58,0.9); border: 1px solid rgba(170,140,255,0.5);
  border-radius: 22px; padding: 28px 26px; text-align: center;
  box-shadow: 0 0 60px rgba(140,90,255,0.5); animation: pop 0.4s cubic-bezier(0.2,1.4,0.4,1);
}
@keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-box h3 { font-size: clamp(18px,3.6vw,24px); margin-bottom: 8px; letter-spacing:2px; color:#e6dcff; text-shadow:0 0 16px rgba(170,130,255,0.8); }
.modal-box p { font-size: 13px; color:#b6c0ee; margin-bottom: 18px; letter-spacing:1px; }
#wishInput {
  width: 100%; padding: 13px 16px; border-radius: 12px; font-size: 15px; font-family: inherit;
  background: rgba(10,6,30,0.7); border: 1px solid rgba(150,130,255,0.5); color:#fff; outline:none;
  text-align: center; letter-spacing:1px; box-shadow: inset 0 0 16px rgba(120,90,255,0.2);
}
#wishInput:focus { border-color: rgba(190,160,255,0.9); box-shadow: 0 0 20px rgba(160,120,255,0.5), inset 0 0 16px rgba(120,90,255,0.25); }
.modal-actions { display:flex; gap:12px; justify-content:center; margin-top:20px; }

/* 顶部加载/降级提示 */
#fallback { position: fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; text-align:center; padding:30px; background:#030014; color:#cdd8ff; font-size:16px; line-height:1.9; letter-spacing:1px; }

/* 音频可视化条 */
#viz { position: fixed; left: 50%; bottom: 1.2vh; transform: translateX(-50%); z-index: 9; display:flex; gap:3px; align-items:flex-end; height:34px; opacity:0; transition:opacity 0.6s; pointer-events:none; }
#viz.show { opacity:0.85; }
#viz span { width:3px; background:linear-gradient(to top,#5a7bff,#c9a6ff,#ff9ad5); border-radius:2px; height:4px; box-shadow:0 0 8px rgba(150,120,255,0.8); transition:height 0.08s linear; }
@media (max-width: 600px) { #viz { display:none; } }
</style>
</head>
<body>

<canvas id="webgl"></canvas>

<!-- 音频频谱可视化 -->
<div id="viz"></div>

<!-- 覆盖层 UI -->
<div id="ui">
  <div class="subtitle-wrap" id="subtitleWrap">
    <div class="subtitle-main">生 日 快 乐</div>
    <div class="subtitle-sub" id="subtitleSub">9月30日 · 又长大一岁啦</div>
  </div>

  <div class="wish-card" id="wishCard">
    <div id="wishText"></div>
    <div class="sign" id="signText"></div>
  </div>

  <div class="btn-row">
    <button class="neon-btn pink" id="btnWishWord">💌 点击收祝福</button>
    <button class="neon-btn cyan" id="btnMusic">🎵 播放生日歌</button>
    <button class="neon-btn gold" id="btnBlow">🕯️ 吹蜡烛</button>
    <button class="neon-btn" id="btnMakeWish">⭐ 许愿</button>
  </div>
</div>

<!-- 提示 Toast -->
<div id="toast"></div>

<!-- 许愿弹窗 -->
<div id="wishModal">
  <div class="modal-box">
    <h3>✨ 许个愿吧 ✨</h3>
    <p>写下你的愿望，它会化作一颗星飞进星空</p>
    <input id="wishInput" type="text" maxlength="30" placeholder="愿魏煜汶……" />
    <div class="modal-actions">
      <button class="neon-btn" id="wishCancel" style="padding:10px 20px;">取消</button>
      <button class="neon-btn gold" id="wishSend" style="padding:10px 20px;">放飞愿望 ⭐</button>
    </div>
  </div>
</div>

<!-- 开场提示（点击解锁音频 & 启动入场动画） -->
<div id="startHint">
  <div class="big">🎂 送给同桌 · 魏煜汶 🎂</div>
  <div class="tap">— 轻触屏幕，点亮今夜的星空 —</div>
</div>

<!-- WebGL 不可用时的降级提示 -->
<div id="fallback">
  你的浏览器似乎不支持 WebGL，无法展示 3D 星空效果。<br>
  但祝福依然送达：魏煜汶，生日快乐！🎉
</div>

<!-- ========================== Three.js r128 + 后期扩展（CDN） ========================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* =========================================================================
 *  魏煜汶 · 生日祝福网页
 *  作者：你的同桌 杨蕙名
 *  说明：单文件实现。Three.js 3D 星空 + 生日蛋糕 + 粒子文字 + 烟花 + Web Audio 生日歌
 *  ★ 所有可修改的文字/颜色/名字/祝福语都集中在下方 CONFIG 配置区
 * ========================================================================= */

/* ========================== ⭐ 顶部配置区 CONFIG（想改内容只改这里） ========================== */
const CONFIG = {
  // ---- 定制信息 ----
  friendName: "魏煜汶",                 // 朋友名字
  callName:   "同桌",                   // 我对他的称呼
  birthday:   "9月30日",                // 生日
  signName:   "你的同桌 杨蕙名",         // 落款
  titleEn:    "Happy Birthday",         // 3D 粒子英文标题
  titleCn:    "魏煜汶",                  // 3D 粒子中文名字
  subtitleMain: "生 日 快 乐",           // 副标题（HTML 层）
  subtitleSub:  "9月30日 · 又长大一岁啦", // 副标题第二行

  // ---- 长祝福（打字机逐字显示） ----
  longWish: "同桌，生日快乐！愿你新的一岁，所有努力都有回响，所有期待都不落空。愿你每天笑得没心没肺，考试全会，蒙的全对！愿你被这个世界温柔以待，天天开心，事事顺意。",

  // ---- 随机祝福数组（点击「收祝福」随机切换） ----
  randomWishes: [
    "愿你眼里有光，心中有梦，脚下有路，所求皆所愿。",
    "新的一岁，愿好运与你撞个满怀，烦恼通通闪开！",
    "愿你被这个世界温柔以待，也愿你温柔地对待自己。",
    "考试全会，蒙的全对，作业秒懂，熬夜不困！",
    "愿你的每一天都像今天一样，被爱与惊喜包围。",
    "星光不问赶路人，时光不负有心人，加油同桌！",
    "愿你想要的都拥有，得不到的都释怀。",
    "生日快乐！愿快乐像 WiFi 一样，走到哪都满格。",
    "愿你前程似锦，归来仍是少年，笑靥如花。",
    "今天的星星都在为你闪烁，生日快乐，魏煜汶！"
  ],

  // ---- 配色方案（星空蓝 + 梦幻紫 + 赛博霓虹） ----
  colors: {
    bg:        0x030014,   // 深空蓝黑背景
    starBlue:  0x7ee8fa,   // 霓虹蓝
    starPurple:0xc9a6ff,   // 梦幻紫
    starPink:  0xff9ad5,   // 霓虹粉
    gold:      0xffe6a0,   // 点缀金
    nebula1:   0x4b2ea8,   // 星云紫
    nebula2:   0x1b3fa0,   // 星云蓝
    nebula3:   0xa02a7a,   // 星云粉紫
    cakeCream: 0xfff3e0,   // 奶油色
    cakePink:  0xffc9e6,   // 奶油粉
    cakeBlue:  0xbfe4ff    // 奶油蓝
  },

  // ---- 音乐（Web Audio 合成《生日快乐》） ----
  music: {
    tempo: 0.42,        // 每拍秒数（越小越快）
    volume: 0.28,       // 主音量
    waveType: "triangle"// 音色波形
  },

  // ---- 粒子数量（移动端会自动降低，见下方 isMobile 判断） ----
  particles: {
    stars: 2600,        // 星空星星数量
    starsMobile: 1100,
    nebula: 1400,       // 星云粒子
    nebulaMobile: 600,
    titleGap: 3,        // 粒子文字采样间隔（越小越密）
    titleGapMobile: 5
  },

  // ---- 入场动画时长（秒） ----
  introDuration: 5.0
};

/* ========================== 全局变量 ========================== */
let scene, camera, renderer, composer, bloomPass, clock;
let useComposer = false;                 // 后期泛光是否可用
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 700;

let starField, nebula, meteorGroup;
let cakeGroup, cakeSpin = { auto: true, velY: 0.0035, velX: 0 };
let candleFlames = [];                   // 每根蜡烛的火焰粒子系统
let smokeSystem = null;                  // 吹灭后的烟雾
let titleGroup = null;                   // 3D 粒子文字
let mouseTrail = null;                   // 鼠标星光拖尾

const fireworks = [];                    // 烟花数组
const confetti  = [];                    // 彩带雨
const hearts    = [];                    // 爱心粒子
const wishStars = [];                    // 许愿星
const shockwaves= [];                    // 冲击波环

let pointer = new THREE.Vector2(0, 0);   // 归一化鼠标坐标
let pointerWorld = new THREE.Vector3();  // 鼠标在 3D 平面上的位置
let beatEnergy = 0;                      // 音乐节拍能量（驱动粒子律动）

// 交互状态机
const STATE = { intro: true, started: false, candlesLit: true, blown: false, musicOn: false };
let introStart = 0;

// 音频
let audioCtx = null, masterGain = null, analyser = null, freqData = null;
let vizBars = [];

/* ========================== 工具函数 ========================== */
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
// 缓动函数
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

// 生成柔和发光的圆形点纹理（用于所有粒子，做出光晕感）
function makeGlowTexture(innerColor) {
  const size = 128;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.2, innerColor || 'rgba(255,255,255,0.9)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.28)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

// 生成爱心形状纹理
function makeHeartTexture() {
  const size = 128, c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.translate(size/2, size/2); ctx.scale(1, 1);
  ctx.beginPath();
  const s = size * 0.032;
  ctx.moveTo(0, s*3);
  ctx.bezierCurveTo(0, s*1.5, -s*4, s*1.5, -s*4, -s*1);
  ctx.bezierCurveTo(-s*4, -s*4, 0, -s*4, 0, -s*1.5);
  ctx.bezierCurveTo(0, -s*4, s*4, -s*4, s*4, -s*1);
  ctx.bezierCurveTo(s*4, s*1.5, 0, s*1.5, 0, s*3);
  const g = ctx.createRadialGradient(0,0,0,0,0,size*0.5);
  g.addColorStop(0,'#ffd6ec'); g.addColorStop(1,'#ff5fae');
  ctx.fillStyle = g; ctx.shadowColor = '#ff77c0'; ctx.shadowBlur = 18; ctx.fill();
  return new THREE.CanvasTexture(c);
}

// 屏幕坐标 → 3D 世界坐标（投射到 z=plane 平面）
function screenToWorld(nx, ny, planeZ) {
  const v = new THREE.Vector3(nx, ny, 0.5);
  v.unproject(camera);
  const dir = v.sub(camera.position).normalize();
  const dist = (planeZ - camera.position.z) / dir.z;
  return camera.position.clone().add(dir.multiplyScalar(dist));
}


/* ========================== 模块一：初始化场景 ========================== */
function initScene() {
  const canvas = document.getElementById('webgl');
  // WebGL 可用性检测，不可用则显示降级祝福
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, alpha: false, powerPreference: 'high-performance' });
  } catch (e) {
    document.getElementById('fallback').style.display = 'flex';
    document.getElementById('startHint').style.display = 'none';
    throw e;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(CONFIG.colors.bg);
  scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.0016);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
  // 入场：相机从很远处开始，动画中缓缓推近
  camera.position.set(0, 40, 900);
  camera.lookAt(0, 0, 0);

  clock = new THREE.Clock();

  // 环境光 + 主光 + 彩色点光源，营造霓虹氛围
  scene.add(new THREE.AmbientLight(0x5566aa, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(60, 120, 80); scene.add(key);
  const p1 = new THREE.PointLight(CONFIG.colors.starPurple, 1.5, 600); p1.position.set(-160, 60, 120); scene.add(p1);
  const p2 = new THREE.PointLight(CONFIG.colors.starBlue, 1.4, 600); p2.position.set(160, 40, 100); scene.add(p2);
  const p3 = new THREE.PointLight(CONFIG.colors.starPink, 1.1, 500); p3.position.set(0, -60, 160); scene.add(p3);

/* ========================== 模块二：后期泛光（Bloom） ========================== */
function setupPostProcessing() {
  // 若扩展脚本加载成功则启用 EffectComposer + UnrealBloomPass，否则直接渲染（降级但可用）
  if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass) {
    try {
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        isMobile ? 0.9 : 1.25,   // strength 泛光强度
        0.7,                     // radius
        0.12                     // threshold 阈值（低阈值让霓虹更炫）
      );
      composer.addPass(bloomPass);
      composer.setSize(window.innerWidth, window.innerHeight);
      useComposer = true;
    } catch (e) { useComposer = false; }
  }
}

/* ========================== 模块三：动态星空背景 ========================== */
function createStars() {
  const count = isMobile ? CONFIG.particles.starsMobile : CONFIG.particles.stars;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const phases = new Float32Array(count);      // 闪烁相位
  const palette = [new THREE.Color(CONFIG.colors.starBlue), new THREE.Color(CONFIG.colors.starPurple),
                   new THREE.Color(CONFIG.colors.starPink), new THREE.Color(0xffffff), new THREE.Color(CONFIG.colors.gold)];
  for (let i = 0; i < count; i++) {
    // 在一个大球壳内随机分布
    const r = rand(300, 1600);
    const theta = rand(0, Math.PI * 2);
    const phi = Math.acos(rand(-1, 1));
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.7;
    pos[i*3+2] = r * Math.cos(phi) * 0.6 - 200;
    const c = pick(palette);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    sizes[i] = rand(1.5, 5.5);
    phases[i] = rand(0, Math.PI * 2);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uTex: { value: makeGlowTexture() }, uBeat: { value: 0 }, uPR: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float aSize; attribute float aPhase; varying vec3 vColor;
      uniform float uTime; uniform float uBeat; uniform float uPR;
      void main(){
        vColor = color;
        vec3 p = position;
        // 星星缓慢漂浮
        p.x += sin(uTime*0.12 + aPhase)*6.0;
        p.y += cos(uTime*0.10 + aPhase)*6.0;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        // 闪烁 + 随音乐节拍放大
        float tw = 0.6 + 0.4*sin(uTime*2.0 + aPhase);
        gl_PointSize = aSize * tw * (1.0 + uBeat*0.9) * uPR * (300.0/ -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uTex; varying vec3 vColor;
      void main(){
        vec4 t = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(vColor, 1.0) * t;
      }`,
    vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  starField = new THREE.Points(geo, mat);
  scene.add(starField);
}

/* ========================== 模块四：梦幻星云 ========================== */
function createNebula() {

  for (let i = 0; i < count; i++) {

    pos[i*3]   = cx + rand(-320, 320);
    pos[i*3+1] = cy + rand(-220, 220);
    pos[i*3+2] = cz + rand(-260, 260);

    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;

        gl_PointSize = aSize * uPR * (300.0/ -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uTex; varying vec3 vColor;
      void main(){ vec4 t = texture2D(uTex, gl_PointCoord); gl_FragColor = vec4(vColor, t.a*0.16); }`,
    vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });

/* ========================== 模块五：流星 ========================== */
function createMeteors() {
  meteorGroup = new THREE.Group(); scene.add(meteorGroup);
  // 预置若干流星，随机时机划过
  for (let i = 0; i < (isMobile ? 3 : 6); i++) {
    const geo = new THREE.BufferGeometry();
    const tail = 22;
    const positions = new Float32Array(tail * 3);
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.LineBasicMaterial({ color: 0xdfeaff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
    const line = new THREE.Line(geo, mat);
    line.userData = { active: false, tail, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, head: new THREE.Vector3() };
    line.frustumCulled = false;
    meteorGroup.add(line);
  }
}
function launchMeteor(line) {
  const u = line.userData;
  u.active = true; u.life = 0;
  // 从屏幕一侧上方随机出现，斜向下划
  const startX = rand(-900, 900), startY = rand(250, 650), startZ = rand(-700, -200);
  u.pos.set(startX, startY, startZ);
  u.head.copy(u.pos);
  u.vel.set(rand(-1, 1) > 0 ? rand(-14, -7) : rand(7, 14), rand(-9, -4), rand(-2, 2)).multiplyScalar(1.4);
  line.material.opacity = 0.95;
}
function updateMeteors(dt, t) {
  meteorGroup.children.forEach(line => {
    const u = line.userData;
    if (!u.active) {
      if (Math.random() < dt * 0.16) launchMeteor(line);   // 随机触发
      return;
    }
    u.life += dt;
    u.head.addScaledVector(u.vel, dt * 60);
    // 更新拖尾：每个点向前一个点靠拢，形成尾巴
    const arr = line.geometry.attributes.position.array;
    for (let i = u.tail - 1; i > 0; i--) {
      arr[i*3]   = lerp(arr[i*3],   arr[(i-1)*3], 0.5);
      arr[i*3+1] = lerp(arr[i*3+1], arr[(i-1)*3+1], 0.5);
      arr[i*3+2] = lerp(arr[i*3+2], arr[(i-1)*3+2], 0.5);
    }
    arr[0] = u.head.x; arr[1] = u.head.y; arr[2] = u.head.z;
    line.geometry.attributes.position.needsUpdate = true;
    line.material.opacity = clamp(0.95 - u.life * 0.5, 0, 0.95);
    if (u.life > 2.0 || u.head.y < -600) { u.active = false; line.material.opacity = 0; }
  });
}


/* ========================== 模块六：3D 生日蛋糕 ========================== */
function createCake() {
  cakeGroup = new THREE.Group();
  cakeGroup.position.set(0, -18, 0);
  scene.add(cakeGroup);

  const C = CONFIG.colors;
  // 三层蛋糕参数：[底部y, 半径, 高度, 奶油色]
  const tiers = [
    { y: 0,   r: 46, h: 26, color: C.cakeCream },
    { y: 26,  r: 36, h: 24, color: C.cakePink  },
    { y: 50,  r: 26, h: 22, color: C.cakeBlue  }
  ];

  tiers.forEach((tier, idx) => {
    // 蛋糕胚（圆柱）
    const bodyMat = new THREE.MeshStandardMaterial({ color: tier.color, roughness: 0.55, metalness: 0.08, emissive: new THREE.Color(tier.color).multiplyScalar(0.12) });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(tier.r, tier.r, tier.h, 48), bodyMat);
    body.position.y = tier.y + tier.h / 2;
    cakeGroup.add(body);

    // 奶油花边：上沿一圈小球（scallop）
    const scallopMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0.05, emissive: 0x223355, emissiveIntensity: 0.4 });
    const ballCount = Math.floor(tier.r * 1.1);
    for (let i = 0; i < ballCount; i++) {
      const a = (i / ballCount) * Math.PI * 2;
      const ball = new THREE.Mesh(new THREE.SphereGeometry(3.4, 10, 10), scallopMat);
      ball.position.set(Math.cos(a) * tier.r, tier.y + tier.h, Math.sin(a) * tier.r);
      cakeGroup.add(ball);
      // 底部也来一圈花边
      const ball2 = new THREE.Mesh(new THREE.SphereGeometry(3.0, 10, 10), scallopMat);
      ball2.position.set(Math.cos(a + 0.1) * tier.r, tier.y + 1.5, Math.sin(a + 0.1) * tier.r);
      cakeGroup.add(ball2);
    }

    // 彩色糖粒：附着在这一层侧面（用 Points 表现，色彩缤纷）
    if (idx < 3) {
      const sprCount = isMobile ? 130 : 260;
      const g = new THREE.BufferGeometry();
      const p = new Float32Array(sprCount * 3), c = new Float32Array(sprCount * 3);
      const sprPalette = [new THREE.Color(0xff5f8d), new THREE.Color(0x5fd0ff), new THREE.Color(0xffe066), new THREE.Color(0xb47cff), new THREE.Color(0x6bffa8)];
      for (let i = 0; i < sprCount; i++) {
        const a = rand(0, Math.PI * 2);
        const yy = rand(tier.y + 3, tier.y + tier.h - 3);
        p[i*3]   = Math.cos(a) * (tier.r + 0.6);
        p[i*3+1] = yy;
        p[i*3+2] = Math.sin(a) * (tier.r + 0.6);
        const cc = pick(sprPalette);
        c[i*3] = cc.r; c[i*3+1] = cc.g; c[i*3+2] = cc.b;
      }
      g.setAttribute('position', new THREE.BufferAttribute(p, 3));
      g.setAttribute('color', new THREE.BufferAttribute(c, 3));
      const m = new THREE.PointsMaterial({ size: 2.6, map: makeGlowTexture(), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
      cakeGroup.add(new THREE.Points(g, m));
    }
  });

  // 顶面奶油
  const topCream = new THREE.Mesh(new THREE.CylinderGeometry(26, 26, 3, 48), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, emissive: 0x334466, emissiveIntensity: 0.5 }));
  topCream.position.y = 72 + 1.5; cakeGroup.add(topCream);

  // ---- 蜡烛 + 火焰 ----
  const candleCount = 7;
  const candleTopY = 73;
  for (let i = 0; i < candleCount; i++) {
    const a = (i / candleCount) * Math.PI * 2;
    const rr = 15;
    const cx = Math.cos(a) * rr, cz = Math.sin(a) * rr;
    // 蜡烛柱（条纹感用两种颜色交替）
    const candleColor = i % 2 === 0 ? 0xffd1e8 : 0xcfe8ff;
    const candle = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 15, 12),
      new THREE.MeshStandardMaterial({ color: candleColor, roughness: 0.4, emissive: candleColor, emissiveIntensity: 0.25 }));
    candle.position.set(cx, candleTopY + 7.5, cz);
    cakeGroup.add(candle);
    // 烛芯
    const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 2, 6), new THREE.MeshBasicMaterial({ color: 0x333333 }));
    wick.position.set(cx, candleTopY + 15.5, cz); cakeGroup.add(wick);
    // 火焰粒子系统
    createFlame(cx, candleTopY + 16.5, cz);
  }
}

// 单根蜡烛的火焰：小粒子系统，持续向上摇曳 + 光晕
function createFlame(x, y, z) {
  const count = isMobile ? 26 : 46;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  const data = [];  // 每个粒子的速度/寿命
  for (let i = 0; i < count; i++) {
    data.push({ life: rand(0, 1), speed: rand(8, 20), sway: rand(0, Math.PI * 2), swaySpeed: rand(2, 5) });
    pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 6, map: makeGlowTexture(), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const flame = new THREE.Points(geo, mat);
  flame.userData = { baseX: x, baseY: y, baseZ: z, count, data, alive: true };
  flame.frustumCulled = false;
  cakeGroup.add(flame);
  candleFlames.push(flame);

  // 火焰点光源（暖色，随闪烁变化）
  const light = new THREE.PointLight(0xffa640, 1.2, 90);
  light.position.set(x, y + 3, z);
  cakeGroup.add(light);
  flame.userData.light = light;
}
function updateFlames(dt, t) {
  candleFlames.forEach(flame => {
    const u = flame.userData;
    if (u.light) u.light.intensity = u.alive ? (1.0 + Math.sin(t * 12 + u.baseX) * 0.35) : 0;
    if (!u.alive) return;
    const arr = flame.geometry.attributes.position.array;
    const carr = flame.geometry.attributes.color.array;
    for (let i = 0; i < u.count; i++) {
      const d = u.data[i];
      d.life += dt * d.speed * 0.12;
      if (d.life > 1) { d.life = 0; d.speed = rand(8, 20); d.sway = rand(0, Math.PI * 2); }
      const h = d.life;                                   // 0→1 上升
      arr[i*3]   = u.baseX + Math.sin(t * d.swaySpeed + d.sway) * 1.6 * h;
      arr[i*3+1] = u.baseY + h * 11;
      arr[i*3+2] = u.baseZ + Math.cos(t * d.swaySpeed + d.sway) * 1.6 * h;
      // 颜色：底部橙黄 → 顶部暗红渐隐
      const fade = 1 - h;
      carr[i*3]   = 1.0 * fade;
      carr[i*3+1] = (0.72 - 0.5 * h) * fade;
      carr[i*3+2] = (0.20 - 0.18 * h) * fade;
    }
    flame.geometry.attributes.position.needsUpdate = true;
    flame.geometry.attributes.color.needsUpdate = true;
  });
}

// 吹灭蜡烛：火焰熄灭 + 冒烟
function blowOutCandles() {
  candleFlames.forEach(f => {
    f.userData.alive = false;
    f.visible = false;
    if (f.userData.light) f.userData.light.intensity = 0;
  });
  createSmoke();
}
function createSmoke() {
  const count = isMobile ? 40 : 80;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  const data = [];
  candleFlames.forEach(f => {
    const per = Math.floor(count / candleFlames.length);
    for (let i = 0; i < per; i++) {
      data.push({ x: f.userData.baseX, y: f.userData.baseY, z: f.userData.baseZ, life: rand(0, 0.4), speed: rand(6, 14), sway: rand(0, 6.28) });
    }
  });
  while (data.length < count) data.push({ x: rand(-15,15), y: 88, z: rand(-15,15), life: rand(0,0.4), speed: rand(6,14), sway: rand(0,6.28) });
  for (let i = 0; i < count; i++) { pos[i*3] = data[i].x; pos[i*3+1] = data[i].y; pos[i*3+2] = data[i].z; col[i*3] = col[i*3+1] = col[i*3+2] = 0.7; }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 9, map: makeGlowTexture(), vertexColors: true, transparent: true, opacity: 0.6, depthWrite: false });
  smokeSystem = new THREE.Points(geo, mat);
  smokeSystem.userData = { data, count, age: 0 };
  smokeSystem.frustumCulled = false;
  cakeGroup.add(smokeSystem);
}
function updateSmoke(dt, t) {
  if (!smokeSystem) return;
  const u = smokeSystem.userData; u.age += dt;
  const arr = smokeSystem.geometry.attributes.position.array;
  for (let i = 0; i < u.count; i++) {
    const d = u.data[i];
    d.life += dt * 0.4;
    arr[i*3]   = d.x + Math.sin(t * 1.5 + d.sway) * 6 * d.life;
    arr[i*3+1] = d.y + d.life * 60;
    arr[i*3+2] = d.z + Math.cos(t * 1.5 + d.sway) * 6 * d.life;
  }
  smokeSystem.geometry.attributes.position.needsUpdate = true;
  smokeSystem.material.opacity = clamp(0.6 - u.age * 0.18, 0, 0.6);
  if (u.age > 3.6) { cakeGroup.remove(smokeSystem); smokeSystem = null; }
}

/* ========================== 模块七：3D 粒子文字标题 ========================== */
// 从文字采样像素点，生成 3D 粒子（无需外部字体文件）
function sampleTextPositions(text, fontSize, gap, scale) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const font = `bold ${fontSize}px "Arial Black","Microsoft YaHei",sans-serif`;
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + fontSize;
  const h = Math.ceil(fontSize * 1.7);
  c.width = w; c.height = h;
  ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.fillText(text, w / 2, h / 2);
  const img = ctx.getImageData(0, 0, w, h).data;
  const pts = [];
  for (let y = 0; y < h; y += gap) {
    for (let x = 0; x < w; x += gap) {
      if (img[(y * w + x) * 4 + 3] > 128) {
        pts.push({ x: (x - w / 2) * scale, y: -(y - h / 2) * scale, nx: x / w });
      }
    }
  }
  return pts;
}
// 创建一行粒子文字，返回 Points（带入场飞散动画数据）
function makeTextLine(text, fontSize, colorA, colorB, yPos, scale) {
  const gap = isMobile ? CONFIG.particles.titleGapMobile : CONFIG.particles.titleGap;
  const pts = sampleTextPositions(text, fontSize, gap, scale);
  const count = pts.length;
  const geo = new THREE.BufferGeometry();
  const cur = new Float32Array(count * 3);   // 当前位置（起始随机飞散）
  const tgt = new Float32Array(count * 3);   // 目标位置
  const col = new Float32Array(count * 3);
  const delays = new Float32Array(count);    // 逐字弹出延迟（按 x 顺序）
  const cA = new THREE.Color(colorA), cB = new THREE.Color(colorB);
  for (let i = 0; i < count; i++) {
    const p = pts[i];
    tgt[i*3] = p.x; tgt[i*3+1] = p.y + yPos; tgt[i*3+2] = rand(-6, 6);
    // 起始：从四周远处随机飞入
    cur[i*3] = p.x + rand(-400, 400); cur[i*3+1] = p.y + yPos + rand(-300, 300); cur[i*3+2] = rand(-500, 100);
    const mix = clamp((p.x / (Math.abs(p.x) + 200)) * 0.5 + 0.5, 0, 1);
    const cc = cA.clone().lerp(cB, mix);
    col[i*3] = cc.r; col[i*3+1] = cc.g; col[i*3+2] = cc.b;
    delays[i] = p.nx * 0.7;   // 左→右逐字浮现
  }
  geo.setAttribute('position', new THREE.BufferAttribute(cur, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: isMobile ? 2.4 : 3.0, map: makeGlowTexture(), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const points = new THREE.Points(geo, mat);
  points.userData = { cur, tgt, count, delays, anim: 0, done: false };
  points.frustumCulled = false;
  return points;
}
function createTitle() {
  titleGroup = new THREE.Group();
  scene.add(titleGroup);
  const C = CONFIG.colors;
  // 构图：相机 lookAt(0,30,0)，英文标题在上、中文名在下，二者留足间距避免重叠
  const en = makeTextLine(CONFIG.titleEn, 80, C.starBlue, C.starPink, isMobile ? 150 : 156, isMobile ? 0.24 : 0.50);
  const cn = makeTextLine(CONFIG.titleCn, 110, C.starPurple, C.gold, isMobile ? 80 : 66, isMobile ? 0.28 : 0.52);
  titleGroup.add(en); titleGroup.add(cn);
  titleGroup.userData = { lines: [en, cn] };
}
function updateTitle(dt) {
  if (!titleGroup) return;
  titleGroup.userData.lines.forEach(line => {
    const u = line.userData;
    if (u.done) return;
    const arr = line.geometry.attributes.position.array;
    let allDone = true;
    for (let i = 0; i < u.count; i++) {
      const local = clamp((u.anim - u.delays[i]) / 0.9, 0, 1);   // 每个粒子按延迟归位
      if (local < 1) allDone = false;
      const e = easeOutCubic(local);
      arr[i*3]   = lerp(arr[i*3],   u.tgt[i*3],   e * 0.22);
      arr[i*3+1] = lerp(arr[i*3+1], u.tgt[i*3+1], e * 0.22);
      arr[i*3+2] = lerp(arr[i*3+2], u.tgt[i*3+2], e * 0.22);
    }
    line.geometry.attributes.position.needsUpdate = true;
    u.anim += dt * 1.15;
    if (allDone && u.anim > 1.8) u.done = true;
  });
  // 标题整体随音乐节拍轻微缩放
  const s = 1 + beatEnergy * 0.05;
  titleGroup.scale.set(s, s, s);
}

    const theta = rand(0, Math.PI * 2), phi = Math.acos(rand(-1, 1)), sp = rand(1.4, 4.6) * (isMobile ? 0.85 : 1);
    vel.push(new THREE.Vector3(Math.sin(phi)*Math.cos(theta)*sp, Math.sin(phi)*Math.sin(theta)*sp, Math.cos(phi)*sp));

function updateFireworks(dt) {

      arr[j*3+2] += u.vel[j].z;

/* ========================== 模块十：Web Audio 音频合成 ========================== */
function initAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = CONFIG.music.volume;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);
  buildViz();
}
// 构建底部频谱可视化条
function buildViz() {
  const viz = document.getElementById('viz');
  const n = isMobile ? 0 : 40;
  for (let i = 0; i < n; i++) { const s = document.createElement('span'); viz.appendChild(s); vizBars.push(s); }
}
// 播放单个音符（带 ADSR 包络，柔和不刺耳）
function playNote(freq, startTime, dur, type, gainPeak) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || CONFIG.music.waveType;
  osc.frequency.setValueAtTime(freq, startTime);
  // 叠加一层八度泛音，音色更亮
  const osc2 = audioCtx.createOscillator(); osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2, startTime);
  const g2 = audioCtx.createGain(); g2.gain.value = (gainPeak || 0.5) * 0.25;
  const peak = gainPeak || 0.5;
  g.gain.setValueAtTime(0.0001, startTime);
  g.gain.exponentialRampToValueAtTime(peak, startTime + 0.03);
  g.gain.exponentialRampToValueAtTime(peak * 0.6, startTime + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
  osc.connect(g); osc2.connect(g2); g2.connect(g); g.connect(masterGain);
  osc.start(startTime); osc2.start(startTime);
  osc.stop(startTime + dur + 0.05); osc2.stop(startTime + dur + 0.05);
}
// 「叮」音效（收祝福时）
function playDing() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [1318.5, 1760].forEach((f, i) => playNote(f, t + i * 0.04, 0.5, 'sine', 0.22));
}
// 烟花「嘭」音效（噪声爆破）
function playBoom() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * 0.4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.5);
  const src = audioCtx.createBufferSource(); src.buffer = buffer;
  const filt = audioCtx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.setValueAtTime(900, t); filt.frequency.exponentialRampToValueAtTime(120, t + 0.4);
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  src.connect(filt); filt.connect(g); g.connect(masterGain); src.start(t);
}

// 《生日快乐》旋律（C 大调，[频率, 拍数]）
const BIRTHDAY_MELODY = [
  [392,0.75],[392,0.25],[440,1],[392,1],[523.25,1],[493.88,2],
  [392,0.75],[392,0.25],[440,1],[392,1],[587.33,1],[523.25,2],
  [392,0.75],[392,0.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],
  [698.46,0.75],[698.46,0.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]
];
let musicTimer = null;
function playBirthdaySong() {
  initAudio();
  if (!audioCtx) { showToast('此浏览器不支持音频合成'); return; }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (STATE.musicOn) { stopMusic(); return; }   // 再次点击 = 停止
  STATE.musicOn = true;
  document.getElementById('btnMusic').textContent = '⏸ 暂停生日歌';
  document.getElementById('viz').classList.add('show');
  const beat = CONFIG.music.tempo;
  let t = audioCtx.currentTime + 0.1;
  const scheduled = [];
  BIRTHDAY_MELODY.forEach(([f, beats]) => {
    const dur = beats * beat;
    scheduled.push({ f, t, dur });
    t += dur;
  });
  const totalDur = (t - audioCtx.currentTime) * 1000;
  // 循环播放：一轮结束后重新调度
  function scheduleRound() {
    if (!STATE.musicOn) return;
    let now = audioCtx.currentTime + 0.05;
    BIRTHDAY_MELODY.forEach(([f, beats]) => {
      const dur = beats * beat;
      playNote(f, now, dur * 0.95, CONFIG.music.waveType, 0.42);
      now += dur;
    });
    const roundMs = (now - audioCtx.currentTime) * 1000;
    musicTimer = setTimeout(scheduleRound, roundMs - 60);
  }
  scheduleRound();
}
function stopMusic() {
  STATE.musicOn = false;
  if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
  document.getElementById('btnMusic').textContent = '🎵 播放生日歌';
  document.getElementById('viz').classList.remove('show');
  beatEnergy = 0;
}
// 读取频谱，驱动粒子律动与可视化条
function updateAudioViz() {
  if (!analyser || !STATE.musicOn) { beatEnergy = lerp(beatEnergy, 0, 0.08); return; }
  analyser.getByteFrequencyData(freqData);
  let sum = 0;
  for (let i = 0; i < freqData.length; i++) sum += freqData[i];
  const avg = sum / freqData.length / 255;
  beatEnergy = lerp(beatEnergy, avg, 0.3);
  // 更新底部频谱条
  for (let i = 0; i < vizBars.length; i++) {
    const idx = Math.floor(i / vizBars.length * freqData.length);
    const h = 4 + (freqData[idx] / 255) * 30;
    vizBars[i].style.height = h + 'px';
  }
}

/* ========================== 模块十二：绑定交互事件 ========================== */
function setupInteraction() {
  const canvas = document.getElementById('webgl');
  let dragging = false, lastX = 0, lastY = 0, moved = 0;

  // 鼠标/触摸移动：更新指针 + 星光拖尾
  function onMove(cx, cy) {
    pointer.x = (cx / window.innerWidth) * 2 - 1;
    pointer.y = -(cy / window.innerHeight) * 2 + 1;
    const wp = screenToWorld(pointer.x, pointer.y, 120);
    if (mouseTrail) mouseTrail.userData.head.copy(wp);
    // 相机轻微视差跟随
    camera.userData.targetX = pointer.x * 22;
    camera.userData.targetY = pointer.y * 14;
  }
  canvas.addEventListener('mousemove', e => { onMove(e.clientX, e.clientY); if (dragging) { const dx = e.clientX - lastX, dy = e.clientY - lastY; cakeSpin.velY = dx * 0.0006; cakeGroup.rotation.y += dx * 0.008; cakeGroup.rotation.x = clamp(cakeGroup.rotation.x + dy * 0.004, -0.5, 0.5); lastX = e.clientX; lastY = e.clientY; moved += Math.abs(dx) + Math.abs(dy); } });
  canvas.addEventListener('touchmove', e => { if (e.touches[0]) { const tt = e.touches[0]; onMove(tt.clientX, tt.clientY); if (dragging) { const dx = tt.clientX - lastX; cakeGroup.rotation.y += dx * 0.008; lastX = tt.clientX; lastY = tt.clientY; moved += Math.abs(dx); } } }, { passive: true });

  // 按下：开始拖动蛋糕
  function onDown(cx, cy) { dragging = true; moved = 0; lastX = cx; lastY = cy; cakeSpin.auto = false; }
  canvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
  canvas.addEventListener('touchstart', e => { if (e.touches[0]) onDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

  // 松开：若几乎没拖动，视为点击 → 小型烟花；点击蛋糕本体 → 吹蜡烛
  function onUp(cx, cy) {
    if (!dragging) return;
    dragging = false;
    setTimeout(() => { cakeSpin.auto = true; }, 1200);   // 松手后恢复自转
    if (moved < 8) {
      // 判断是否点在蛋糕上（射线检测）
      const nx = (cx / window.innerWidth) * 2 - 1, ny = -(cy / window.innerHeight) * 2 + 1;
      const ray = new THREE.Raycaster(); ray.setFromCamera({ x: nx, y: ny }, camera);
      const hit = ray.intersectObject(cakeGroup, true);
      if (hit.length > 0) { blowCandles(); }
      else {
        initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        const wp = screenToWorld(nx, ny, 60);
        spawnFirework(wp); spawnHearts(wp.clone());
      }
    }
  }
  window.addEventListener('mouseup', e => onUp(e.clientX, e.clientY));
  window.addEventListener('touchend', e => { const t = (e.changedTouches && e.changedTouches[0]); if (t) onUp(t.clientX, t.clientY); });

  // 按钮
  document.getElementById('btnWishWord').addEventListener('click', showRandomWish);
  document.getElementById('btnMusic').addEventListener('click', playBirthdaySong);
  document.getElementById('btnBlow').addEventListener('click', blowCandles);
  document.getElementById('btnMakeWish').addEventListener('click', openWishModal);
  document.getElementById('wishCancel').addEventListener('click', closeWishModal);
  document.getElementById('wishSend').addEventListener('click', sendWish);
  document.getElementById('wishInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendWish(); });
  document.getElementById('wishModal').addEventListener('click', e => { if (e.target.id === 'wishModal') closeWishModal(); });

  // 窗口大小自适应
  window.addEventListener('resize', onResize);

  // 开场提示：点击进入（解锁音频 + 启动入场动画）
  document.getElementById('startHint').addEventListener('click', startExperience);
  document.getElementById('startHint').addEventListener('touchend', startExperience);
}
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (useComposer) composer.setSize(window.innerWidth, window.innerHeight);
}


/* ========================== 模块十三：开场体验 & 入场动画时间线 ========================== */
function startExperience() {
  if (STATE.started) return;
  STATE.started = true;
  const hint = document.getElementById('startHint');
  hint.classList.add('hide');
  setTimeout(() => { hint.style.display = 'none'; }, 1000);
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  introStart = clock.getElapsedTime();
  STATE.intro = true;

  const introMs = CONFIG.introDuration * 1000;
  // 入场过半：副标题光晕渐显 + 长祝福打字机
  setTimeout(() => {
    document.getElementById('subtitleWrap').classList.add('show');
    document.getElementById('wishCard').classList.add('show');
    typeWriter(document.getElementById('wishText'), CONFIG.longWish, 62);
    document.getElementById('signText').textContent = '—— ' + CONFIG.signName;
  }, introMs * 0.5);
  // 入场尾声：来一轮庆祝烟花
  setTimeout(() => { fireworksShow(); playDing(); }, introMs * 0.82);
}

/* ========================== 模块十四：主动画循环 ========================== */
const CAM_END_Z_DESKTOP = 320, CAM_END_Z_MOBILE = 385;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  updateAudioViz();

  const endZ = isMobile ? CAM_END_Z_MOBILE : CAM_END_Z_DESKTOP;

  // ---- 相机：入场推进 / 之后视差跟随 ----
  if (STATE.started && STATE.intro) {
    const p = clamp((t - introStart) / CONFIG.introDuration, 0, 1);
    const e = easeInOutCubic(p);
    camera.position.z = lerp(900, endZ, e);
    camera.position.y = lerp(70, 30, e);
    camera.position.x = lerp(0, 0, e);
    // 星空汇聚感：入场时整体缩放
    if (starField) { const s = lerp(1.7, 1.0, e); starField.scale.set(s, s, s); }
    if (p >= 1) STATE.intro = false;
  } else if (STATE.started) {
    const tx = camera.userData.targetX || 0, ty = camera.userData.targetY || 0;
    camera.position.x = lerp(camera.position.x, tx, 0.045);
    camera.position.y = lerp(camera.position.y, 30 + ty, 0.045);
    camera.position.z = lerp(camera.position.z, endZ, 0.05);
  } else {
    // 未开始：缓慢环绕，作为开场提示的动态背景
    camera.position.x = Math.sin(t * 0.12) * 40;
    camera.position.z = lerp(camera.position.z, endZ + 120, 0.02);
    camera.position.y = lerp(camera.position.y, 40, 0.02);
  }
  camera.lookAt(0, 30, 0);

  // ---- 星空 & 星云 ----
  if (starField) {
    starField.material.uniforms.uTime.value = t;
    starField.material.uniforms.uBeat.value = beatEnergy;
    starField.rotation.y += dt * 0.008;
    starField.rotation.x += dt * 0.002;
  }
  if (nebula) { nebula.material.uniforms.uTime.value = t; nebula.rotation.y -= dt * 0.006; }
  updateMeteors(dt, t);

  // ---- 蛋糕 ----
  if (cakeGroup) {
    if (cakeSpin.auto) cakeGroup.rotation.y += 0.0035 + beatEnergy * 0.006;
    else { cakeGroup.rotation.y += cakeSpin.velY; cakeSpin.velY *= 0.94; }
    cakeGroup.position.y = (cakeGroup.userData.baseY || -88) + Math.sin(t * 0.8) * 3;
  }
  if (STATE.candlesLit) updateFlames(dt, t);
  updateSmoke(dt, t);

  // ---- 粒子文字标题 ----
  updateTitle(dt);

  // ---- 鼠标拖尾 ----
  updateMouseTrail();

  // ---- 各类特效 ----
  updateFireworks(dt);
  updateShockwaves(dt);
  updateConfetti(dt, t);
  updateHearts(dt);
  updateWishStars(dt);

  // ---- 泛光随音乐脉动 ----
  if (useComposer && bloomPass) {
    bloomPass.strength = (isMobile ? 0.9 : 1.25) + beatEnergy * 0.7;
  }

  if (useComposer) composer.render();
  else renderer.render(scene, camera);
}

/* ========================== 启动引导 ========================== */
function boot() {
  // CDN 未加载成功的兜底
  if (typeof THREE === 'undefined') {
    document.getElementById('fallback').style.display = 'flex';
    document.getElementById('startHint').style.display = 'none';
    return;
  }
  try {
    initScene();
    camera.userData.targetX = 0; camera.userData.targetY = 0;
    createStars();
    createNebula();
    createMeteors();
    createCake();
    createTitle();
    createMouseTrail();

    // 蛋糕定位（桌面/移动端不同，保证构图不溢出）
    cakeGroup.userData.baseY = isMobile ? -100 : -88;
    cakeGroup.position.y = cakeGroup.userData.baseY;
    cakeGroup.scale.setScalar(isMobile ? 0.85 : 0.95);

    setupInteraction();

    // 写入配置文案到 HTML 层
    document.querySelector('.subtitle-main').textContent = CONFIG.subtitleMain;
    document.getElementById('subtitleSub').textContent = CONFIG.subtitleSub;
    document.getElementById('signText').textContent = '—— ' + CONFIG.signName;

    animate();
  } catch (e) {
    console.error('初始化失败：', e);
    document.getElementById('fallback').style.display = 'flex';
    document.getElementById('startHint').style.display = 'none';
  }
}
window.addEventListener('load', boot);
</script>
